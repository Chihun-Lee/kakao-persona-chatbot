<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kakao persona chatbot</title>
<style>
  :root { --kakao-bg:#b2c7da; --bubble-me:#fef01b; --bubble-bot:#ffffff; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:#9bb2c9; height:100vh; display:flex; justify-content:center; }
  #app { width:100%; max-width:480px; height:100vh; display:flex; flex-direction:column; background:var(--kakao-bg); }
  header { background:#a9c0d5; padding:10px 14px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #93aabf; }
  header .title { font-weight:700; font-size:15px; flex:1; }
  header .sub { font-size:11px; color:#4a5a68; }
  select,button.hbtn { border:1px solid #7d94a8; background:#f4f8fb; border-radius:6px; font-size:12px; padding:4px 6px; }
  #chat { flex:1; overflow-y:auto; padding:12px 10px 20px; }
  .row { display:flex; margin:2px 0; align-items:flex-end; }
  .row.me { justify-content:flex-end; }
  .name { font-size:11px; color:#42505c; margin:8px 0 2px 46px; }
  .avatar { width:36px; height:36px; border-radius:14px; background:#dfe7ee; margin-right:8px; display:flex; align-items:center; justify-content:center; font-size:18px; flex:none; }
  .bubble { max-width:70%; padding:7px 10px; border-radius:12px; font-size:14px; line-height:1.45; white-space:pre-wrap; word-break:break-word; box-shadow:0 1px 1px rgba(0,0,0,.08); }
  .me .bubble { background:var(--bubble-me); border-top-right-radius:3px; }
  .bot .bubble { background:var(--bubble-bot); border-top-left-radius:3px; }
  .time { font-size:10px; color:#5b6b79; margin:0 6px; flex:none; }
  .sys { text-align:center; margin:10px 0; }
  .sys span { background:rgba(0,0,0,.18); color:#fff; font-size:11px; padding:3px 12px; border-radius:12px; }
  .typing { color:#75858f; font-size:12px; margin:4px 0 4px 46px; }
  .memo { background:#eef4f9; border:1px solid #c8d6e2; border-radius:10px; font-size:11px; color:#3d4e5c; padding:8px 10px; margin:8px 4px; }
  .memo b { display:block; margin-bottom:3px; }
  footer { display:flex; gap:8px; padding:10px; background:#eef2f5; border-top:1px solid #d4dde4; }
  footer input { flex:1; border:1px solid #cfd9e1; border-radius:18px; padding:10px 14px; font-size:14px; outline:none; }
  footer button { border:none; background:#fef01b; border-radius:18px; padding:0 18px; font-weight:700; font-size:13px; cursor:pointer; }
  footer button:disabled { opacity:.5; }
  #autoBtn.on { background:#3d3d3d; color:#fef01b; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar" id="botAvatar">🤖</div>
    <div style="flex:1">
      <div class="title" id="roomTitle">불러오는 중...</div>
      <div class="sub" id="roomSub"></div>
    </div>
    <select id="roleSel" title="내 역할 선택"></select>
    <button class="hbtn" id="autoBtn" title="두 페르소나끼리 자동 대화">자동</button>
    <button class="hbtn" id="memBtn" title="기억 근거 표시">🧠</button>
  </header>
  <div id="chat"></div>
  <footer>
    <input id="msgInput" placeholder="메시지 입력" autocomplete="off">
    <button id="sendBtn">전송</button>
  </footer>
</div>
<script>
let personas = [], me = null, bot = null, history = [], busy = false, showMem = true, autoMode = false;
const $ = id => document.getElementById(id);

async function init() {
  const info = await (await fetch('/api/info')).json();
  personas = info.personas;
  const sel = $('roleSel');
  personas.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = '내가 ' + p; sel.appendChild(o); });
  sel.onchange = () => setRoles(sel.value);
  setRoles(personas[0]);
  $('roomSub').textContent = `${info.provider}/${info.model} · 기억 ${info.episodes}개 에피소드 (${info.period ? info.period.join('~') : ''})`;
  sysMsg('페르소나 로드 완료. 대화를 시작해보세요!');
}

function setRoles(m) {
  me = m; bot = personas.find(p => p !== m) || personas[0];
  $('roomTitle').textContent = bot;
  history = []; $('chat').innerHTML = '';
  sysMsg(`역할 변경: 나=${me}, 봇=${bot}`);
}

function sysMsg(t) { $('chat').insertAdjacentHTML('beforeend', `<div class="sys"><span>${t}</span></div>`); scroll(); }
function nowTime() { const d = new Date(); return `${d.getHours() < 12 ? '오전' : '오후'} ${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2,'0')}`; }

function addBubble(speaker, text, isMe, withName) {
  const chat = $('chat');
  if (!isMe && withName) chat.insertAdjacentHTML('beforeend', `<div class="name">${speaker}</div>`);
  const esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  chat.insertAdjacentHTML('beforeend', isMe
    ? `<div class="row me"><span class="time">${nowTime()}</span><div class="bubble">${esc}</div></div>`
    : `<div class="row bot"><div class="avatar">${speaker[0]}</div><div class="bubble">${esc}</div><span class="time">${nowTime()}</span></div>`);
  scroll();
}
function scroll() { const c = $('chat'); c.scrollTop = c.scrollHeight; }

async function askBot(botName) {
  busy = true; $('sendBtn').disabled = true;
  $('chat').insertAdjacentHTML('beforeend', `<div class="typing" id="typing">${botName} 입력 중...</div>`); scroll();
  try {
    const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ bot: botName, history }) });
    const data = await res.json();
    document.getElementById('typing')?.remove();
    if (data.error) { sysMsg('⚠️ ' + data.error); return null; }
    if (showMem && data.recall?.length) {
      const r = data.recall[0];
      $('chat').insertAdjacentHTML('beforeend',
        `<div class="memo"><b>🧠 떠올린 기억 (${r.date})</b>${r.preview.map(l=>l.replace(/</g,'&lt;')).join('<br>')}</div>`);
    }
    for (const [i, m] of data.messages.entries()) {
      await new Promise(r => setTimeout(r, i ? 400 + Math.random()*500 : 0));
      addBubble(botName, m, false, i === 0);
      history.push({ speaker: botName, text: m });
    }
    return data.messages;
  } catch (e) { document.getElementById('typing')?.remove(); sysMsg('⚠️ 서버 오류: ' + e); return null; }
  finally { busy = false; $('sendBtn').disabled = false; }
}

async function send() {
  const input = $('msgInput'); const text = input.value.trim();
  if (!text || busy) return;
  input.value = '';
  addBubble(me, text, true, false);
  history.push({ speaker: me, text });
  await askBot(bot);
}

async function autoLoop() {
  let next = bot;
  while (autoMode) {
    const msgs = await askBotAs(next);
    if (!msgs) break;
    next = personas.find(p => p !== next);
    await new Promise(r => setTimeout(r, 800));
  }
}
// 자동 모드: 화자를 번갈아가며 봇이 양쪽 다 연기
async function askBotAs(name) {
  const other = personas.find(p => p !== name);
  busy = true;
  $('chat').insertAdjacentHTML('beforeend', `<div class="typing" id="typing">${name} 입력 중...</div>`); scroll();
  try {
    const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ bot: name, history }) });
    const data = await res.json();
    document.getElementById('typing')?.remove();
    if (data.error) { sysMsg('⚠️ ' + data.error); return null; }
    const isMe = name === me;
    for (const [i, m] of data.messages.entries()) {
      await new Promise(r => setTimeout(r, i ? 400 : 0));
      addBubble(name, m, isMe, i === 0);
      history.push({ speaker: name, text: m });
    }
    return data.messages;
  } catch (e) { document.getElementById('typing')?.remove(); sysMsg('⚠️ ' + e); return null; }
  finally { busy = false; }
}

$('sendBtn').onclick = send;
$('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('memBtn').onclick = () => { showMem = !showMem; sysMsg('기억 표시: ' + (showMem ? 'ON' : 'OFF')); };
$('autoBtn').onclick = async () => {
  autoMode = !autoMode;
  $('autoBtn').classList.toggle('on', autoMode);
  if (autoMode) {
    sysMsg(`자동 대화 시작 (${personas.join(' ↔ ')}) — 다시 누르면 중지`);
    if (!history.length) { history.push({ speaker: me, text: '뭐해?' }); addBubble(me, '뭐해?', true, false); }
    autoLoop();
  } else sysMsg('자동 대화 중지');
};
init();
</script>
</body>
</html>
