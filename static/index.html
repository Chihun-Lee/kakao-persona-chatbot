<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페르소나 말투 변환</title>
<style>
:root{--bg:#1f1f1e;--panel:#2a2a28;--line:#3b3a37;--ink:#f0eee8;--sub:#a8a59c;--acc:#d97757;--typo:#7a3b28;--space:#3d5a80;--period:#4f6b3a;--sign:#6b4f8f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:1120px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:26px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
select,input,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:190px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#out{white-space:pre-wrap;min-height:190px;font-size:17px}
#out .e{border-radius:4px;padding:0 2px}
#out .typo{background:var(--typo)}#out .space{background:var(--space)}#out .period{background:var(--period)}#out .signoff{background:var(--sign)}
#out.plain .e{background:none;padding:0}
#out.plain .gap{display:none}
#out .gap{display:inline-block;width:6px;height:1em;vertical-align:-2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--sub);font-size:13px;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#warn{color:#ffb4a2;font-size:14px;margin-top:10px}
#err{color:#ffb4a2;margin-top:10px}
.note{color:var(--sub);font-size:13px;margin-top:18px}
.check{display:flex;align-items:center;gap:6px;margin:10px 0 0;color:var(--sub);font-size:14px}.check input{width:auto}
</style>
</head>
<body>
<main>
  <h1>페르소나 말투 변환</h1>
  <p class="lead">전하고 싶은 말을 적으면, 고른 사람의 말투로 바꿉니다.</p>
  <div class="grid">
    <section class="card">
      <div class="row">
        <div><label for="persona">페르소나</label><select id="persona"></select></div>
        <div><label for="channel">어디에 쓸 글</label><select id="channel"></select></div>
      </div>
      <div class="row">
        <div><label for="relation">받는 사람</label><input id="relation" placeholder="예: 거래처 부장님"></div>
        <div><label for="level">사람 같은 실수</label>
          <select id="level"><option value="off">없음</option><option value="low" selected>아주 가끔</option><option value="normal">가끔</option><option value="high">자주</option></select></div>
      </div>
      <label for="text">전할 말</label>
      <textarea id="text" placeholder="예: 납기가 11/17로 하루 늦어져요. 죄송하다고 전해 주세요."></textarea>
      <label for="protect">오타를 내면 안 되는 말 (쉼표로 구분)</label>
      <input id="protect" placeholder="예: 김철수, 청림기계">
      <div class="actions"><button id="go">말투로 바꾸기</button></div>
      <div id="err"></div>
    </section>
    <section class="card">
      <label style="margin-top:0">결과</label>
      <div id="out"></div>
      <label class="check"><input type="checkbox" id="show" checked> 바뀐 곳 표시</label>
      <div class="legend"><span><i style="background:var(--typo)"></i>오타</span><span><i style="background:var(--space)"></i>붙여 쓰기</span><span><i style="background:var(--period)"></i>마침표 뺌</span><span><i style="background:var(--sign)"></i>맺음말</span></div>
      <div class="actions"><button class="ghost" id="reroll" disabled>실수만 다시 넣기</button><button class="ghost" id="copy" disabled>복사</button></div>
      <div id="warn"></div>
    </section>
  </div>
  <p class="note">숫자, 날짜, 금액, 영문, 호칭이 붙은 이름은 실수 단계에서 바꾸지 않습니다. 보내기 전에 꼭 읽어 보세요. 본인이나 허락받은 사람의 말투만 쓰세요. 입력한 글은 서버에 저장하지 않지만 AI 모델로 전송됩니다.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
let list = [], last = null;

async function api(path, body) {
  const res = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : undefined);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || "요청을 처리하지 못했습니다.");
  return data;
}
function fillChannels() {
  const p = list.find((x) => x.id === $("persona").value);
  $("channel").replaceChildren(...p.channels.map((c) => new Option(c.name, c.id)));
}
function protectTerms() { return $("protect").value.split(",").map((s) => s.trim()).filter(Boolean); }
function render(data) {
  last = data;
  const box = $("out");
  box.replaceChildren();
  for (const seg of data.segments) {
    if (!seg.kind) { box.append(seg.t); continue; }
    const span = document.createElement("span");
    span.className = "e " + seg.kind;
    span.title = "원래: " + (seg.from === " " ? "띄어쓰기" : seg.from);
    if (seg.t) span.textContent = seg.t; else { const g = document.createElement("span"); g.className = "gap"; span.append(g); }
    box.append(span);
  }
  box.classList.toggle("plain", !$("show").checked);
  $("reroll").disabled = $("copy").disabled = false;
}
async function run(button, work) {
  button.disabled = true; $("err").textContent = "";
  try { await work(); } catch (e) { $("err").textContent = e.message; } finally { button.disabled = false; }
}
$("persona").onchange = fillChannels;
$("show").onchange = () => $("out").classList.toggle("plain", !$("show").checked);
$("go").onclick = () => run($("go"), async () => {
  const data = await api("/api/rewrite", {persona: $("persona").value, channel: $("channel").value, relation: $("relation").value, text: $("text").value, level: $("level").value, protect: protectTerms()});
  render(data);
  $("warn").textContent = (data.warnings || []).join(" ");
});
$("reroll").onclick = () => run($("reroll"), async () => {
  render(await api("/api/noise", {persona: $("persona").value, channel: $("channel").value, text: last.clean, level: $("level").value, protect: protectTerms()}));
});
$("copy").onclick = () => navigator.clipboard.writeText(last.text);
api("/api/personas").then((data) => {
  list = data.personas;
  $("persona").replaceChildren(...list.map((p) => new Option(p.name, p.id)));
  fillChannels();
}).catch((e) => { $("err").textContent = e.message; });
</script>
</body>
</html>
